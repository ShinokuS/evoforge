[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

eclipse.project.name = appName + '-generation'

// Compile-time firewall: generation may consume only neutral foundation contracts and World read/state
// contracts. It must never depend on simulation mechanics or presentation.
def allowedGenerationProjectDependencies = [':foundation', ':world'] as Set
configurations.configureEach {
    dependencies.withType(ProjectDependency).configureEach { dependency ->
        if (!allowedGenerationProjectDependencies.contains(dependency.dependencyProject.path)) {
            throw new GradleException(
                    "generation module may depend only on :foundation and :world, not "
                            + dependency.dependencyProject.path)
        }
    }
}

dependencies {
    implementation project(':foundation')
    implementation project(':world')

    testImplementation "org.junit.jupiter:junit-jupiter:$junitVersion"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat = "full"
    }
}
