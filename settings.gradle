plugins {
  // Allows Gradle toolchains to resolve/download JDKs consistently.
  id("org.gradle.toolchains.foojay-resolver-convention") version "1.0.0"
}

// Repository boundaries are deployment/tooling boundaries, not simulation-domain boundaries.
// All authoritative world state, Genesis, physics, mechanics, agents and runtime execution live
// inside :simulation and are separated there by semantic ownership with executable architecture tests.
include 'lwjgl3', 'core', 'simulation'
