name: Mark Stage 5 Unblocked

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  docs:
    if: github.head_ref == 'agent/post-architecture-status'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Mark Stage 5 unblocked
        run: python tools/mark-stage5-unblocked.py
      - name: Validate and build docs
        run: |
          git diff --check
          npm ci
          npm run docs:build
      - name: Remove one-shot tooling
        run: |
          rm -f tools/mark-stage5-unblocked.py
          rm -f .github/workflows/mark-stage5-unblocked.yml
          rmdir tools 2>/dev/null || true
      - name: Commit verified status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: mark Continuum Stage 5 ready'
          git push origin HEAD:${{ github.head_ref }}
