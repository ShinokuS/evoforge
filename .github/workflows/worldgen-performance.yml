name: Worldgen Performance Profile

on:
  pull_request:
    paths:
      - "simulation/src/main/java/io/github/evoforge/simulation/world/**"
      - "simulation/src/test/java/io/github/evoforge/simulation/profile/WorldGenerationScaleProfileTest.java"
      - "simulation/build.gradle"
      - ".github/workflows/worldgen-performance.yml"
  workflow_dispatch:
    inputs:
      side:
        description: "Square world side length in cells"
        required: true
        default: "512"
        type: string

permissions:
  contents: read

concurrency:
  group: worldgen-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    name: Worldgen scale profile
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Resolve profile size
        id: profile
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "side=${{ inputs.side }}" >> "$GITHUB_OUTPUT"
          else
            echo "side=512" >> "$GITHUB_OUTPUT"
          fi

      - name: Run worldgen profile
        env:
          JAVA_TOOL_OPTIONS: -Xmx6g
        run: >-
          ./gradlew
          -Devoforge.worldgen.profile.side=${{ steps.profile.outputs.side }}
          :simulation:worldgenScaleProfile
          --no-daemon
          --console=plain
