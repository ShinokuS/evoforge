name: Architecture Package Migration

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'agent/simulation-architecture-reset'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout architecture branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply deterministic owner-first package migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path('.')
          marker = Path('simulation/src/main/java/io/github/evoforge/simulation/world/agent')
          old_time = Path('simulation/src/main/java/io/github/evoforge/simulation/time')
          old_terrain = Path('simulation/src/main/java/io/github/evoforge/simulation/world/landscape/terrain')
          if not marker.exists() and not old_time.exists() and not old_terrain.exists():
              print('Owner-first package migration already applied.')
              raise SystemExit(0)

          prefix_moves = {
              'io.github.evoforge.simulation.world.landscape.water': 'io.github.evoforge.simulation.world.liquid.water',
              'io.github.evoforge.simulation.world.landscape.terrain': 'io.github.evoforge.simulation.world.terrain',
              'io.github.evoforge.simulation.world.landscape.liquid': 'io.github.evoforge.simulation.world.liquid',
              'io.github.evoforge.simulation.world.landscape.soil': 'io.github.evoforge.simulation.world.soil',
              'io.github.evoforge.simulation.world.landscape.definition': 'io.github.evoforge.simulation.world.terrain.definition',
              'io.github.evoforge.simulation.world.agent': 'io.github.evoforge.simulation.agents',
              'io.github.evoforge.simulation.control.terrain': 'io.github.evoforge.simulation.world.terrain.command',
              'io.github.evoforge.simulation.control.core': 'io.github.evoforge.simulation.kernel.command',
              'io.github.evoforge.simulation.control.sync': 'io.github.evoforge.simulation.kernel.command',
          }

          time_types = {
              'ElapsedTimeTransition', 'LongHorizonClock', 'SimulationClock',
              'SimulationInstant', 'SimulationTime', 'SimulationTimeScale'
          }
          scheduling_types = {
              'BoundProcessScheduler', 'CompactingStateBuffer', 'HandlerId',
              'HandlerRegistry', 'ProcessScheduler', 'ScheduledHandler',
              'ScheduledTask', 'ScheduledWake', 'Scheduler', 'SimulationStepper',
              'SleepingProcessScheduler', 'SleepingProcessSchedulerMetrics',
              'TaskHandle', 'WakeReason'
          }

          exact_moves = {}
          for name in time_types:
              exact_moves[f'io.github.evoforge.simulation.time.{name}'] = (
                  f'io.github.evoforge.simulation.kernel.time.{name}')
          for name in scheduling_types:
              exact_moves[f'io.github.evoforge.simulation.time.{name}'] = (
                  f'io.github.evoforge.simulation.kernel.scheduling.{name}')

          replacements = sorted(
              list(exact_moves.items()) + list(prefix_moves.items()),
              key=lambda item: len(item[0]), reverse=True)

          for path in list(root.rglob('*.java')):
              text = path.read_text()
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated)

          def package_path(package):
              return Path(*package.split('.'))

          source_roots = [
              Path('simulation/src/main/java'),
              Path('simulation/src/test/java'),
              Path('core/src/main/java'),
              Path('core/src/test/java'),
          ]

          for source_root in source_roots:
              for old, new in sorted(prefix_moves.items(), key=lambda item: len(item[0]), reverse=True):
                  old_dir = source_root / package_path(old)
                  new_dir = source_root / package_path(new)
                  if not old_dir.exists():
                      continue
                  new_dir.parent.mkdir(parents=True, exist_ok=True)
                  if new_dir.exists():
                      for source in list(old_dir.rglob('*')):
                          if not source.is_file():
                              continue
                          target = new_dir / source.relative_to(old_dir)
                          target.parent.mkdir(parents=True, exist_ok=True)
                          if target.exists():
                              raise RuntimeError(f'package move collision: {target}')
                          shutil.move(source, target)
                      shutil.rmtree(old_dir)
                  else:
                      shutil.move(old_dir, new_dir)

          old_package = 'io.github.evoforge.simulation.time'
          time_package = 'io.github.evoforge.simulation.kernel.time'
          scheduling_package = 'io.github.evoforge.simulation.kernel.scheduling'

          for source_root in [Path('simulation/src/main/java'), Path('simulation/src/test/java')]:
              old_dir = source_root / package_path(old_package)
              if not old_dir.exists():
                  continue
              for path in list(old_dir.rglob('*.java')):
                  name = path.stem
                  if name in time_types:
                      new_package = time_package
                  elif name in scheduling_types:
                      new_package = scheduling_package
                  else:
                      text = path.read_text()
                      scheduling_markers = (
                          'Scheduler', 'ProcessScheduler', 'ScheduledWake',
                          'SleepingProcessScheduler', 'HandlerRegistry', 'TaskHandle')
                      new_package = scheduling_package if any(
                          marker in text for marker in scheduling_markers) else time_package

                  target = source_root / package_path(new_package) / path.name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  text = path.read_text().replace(
                      f'package {old_package};', f'package {new_package};')

                  imports = []
                  for dependency in sorted(time_types):
                      if new_package != time_package and re.search(r'\b' + dependency + r'\b', text):
                          imports.append(f'import {time_package}.{dependency};')
                  for dependency in sorted(scheduling_types):
                      if new_package != scheduling_package and re.search(r'\b' + dependency + r'\b', text):
                          imports.append(f'import {scheduling_package}.{dependency};')
                  if imports:
                      package_line = f'package {new_package};\n'
                      text = text.replace(
                          package_line,
                          package_line + '\n' + '\n'.join(imports) + '\n',
                          1)
                  target.write_text(text)
                  path.unlink()
              try:
                  old_dir.rmdir()
              except OSError:
                  pass

          for source_root in [Path('simulation/src/main/java'), Path('simulation/src/test/java')]:
              for path in source_root.rglob('*.java'):
                  expected_package = '.'.join(path.parent.relative_to(source_root).parts)
                  text = path.read_text()
                  updated = re.sub(
                      r'^package\s+[\w.]+;',
                      f'package {expected_package};',
                      text,
                      count=1,
                      flags=re.MULTILINE)
                  if updated != text:
                      path.write_text(updated)

          # LandscapeDefinition was in fact Terrain's authored identity; make the file/type name match ownership.
          for path in list(root.rglob('*.java')):
              text = path.read_text()
              updated = (text
                  .replace('LandscapeDefinitionId', 'TerrainDefinitionId')
                  .replace('LandscapeDefinitionBootstrap', 'TerrainDefinitionBootstrap'))
              if updated != text:
                  path.write_text(updated)

          renames = {
              'LandscapeDefinitionId.java': 'TerrainDefinitionId.java',
              'LandscapeDefinitionBootstrap.java': 'TerrainDefinitionBootstrap.java',
              'LandscapeDefinitionIdTest.java': 'TerrainDefinitionIdTest.java',
              'LandscapeDefinitionBootstrapTest.java': 'TerrainDefinitionBootstrapTest.java',
          }
          for source_root in [Path('simulation/src/main/java'), Path('simulation/src/test/java')]:
              for old_name, new_name in renames.items():
                  for path in list(source_root.rglob(old_name)):
                      path.rename(path.with_name(new_name))

          forbidden = [
              'io.github.evoforge.simulation.time',
              'io.github.evoforge.simulation.world.agent',
              'io.github.evoforge.simulation.world.landscape.terrain',
              'io.github.evoforge.simulation.world.landscape.liquid',
              'io.github.evoforge.simulation.world.landscape.soil',
              'io.github.evoforge.simulation.world.landscape.water',
              'io.github.evoforge.simulation.world.landscape.definition',
              'io.github.evoforge.simulation.control.core',
              'io.github.evoforge.simulation.control.sync',
              'io.github.evoforge.simulation.control.terrain',
          ]
          violations = []
          for path in root.rglob('*.java'):
              text = path.read_text()
              for old in forbidden:
                  if old in text:
                      violations.append(f'{path}: {old}')
          if violations:
              raise RuntimeError('old package references remain:\n' + '\n'.join(violations))
          PY

      - name: Run full test suite before committing migration
        run: ./gradlew test --no-daemon --console=plain

      - name: Commit migration only when tests are green
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No package migration changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(architecture): move clear domains to owner-first packages'
          git push origin HEAD:${{ github.head_ref }}
