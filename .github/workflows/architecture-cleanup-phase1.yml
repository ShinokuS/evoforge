name: Architecture Cleanup Phase 1

on:
  push:
    branches:
      - agent/architecture-simplification
    paths:
      - .github/workflows/architecture-cleanup-phase1.yml

permissions:
  contents: write

jobs:
  simplify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: agent/architecture-simplification

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Apply deterministic module cleanup
        run: python3 scripts/architecture_cleanup_phase1.py

      - name: Check patch integrity
        run: git diff --check

      - name: Run all tests
        run: ./gradlew clean test --no-daemon --console=plain

      - name: Run world and physics scale profiles
        run: ./gradlew :world:scaleProfile :physics:scaleProfile --no-daemon --console=plain

      - name: Commit successful cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No cleanup changes produced"; exit 1; }
          git commit -m "refactor(architecture): collapse modules into world generator physics"
          git push origin HEAD:agent/architecture-simplification
