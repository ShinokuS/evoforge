name: Finalize Architecture Reset

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

concurrency:
  group: finalize-architecture-reset-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.head_ref == 'agent/simulation-architecture-reset'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout architecture branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Finalize canonical architecture context
        run: python tools/finalize-architecture-reset.py

      - name: Reject malformed patch output
        run: git diff --check

      - name: Run full tests and coverage gate
        run: ./gradlew test :simulation:jacocoTestCoverageVerification --no-daemon --console=plain

      - name: Run simulation scale profiles
        run: ./gradlew :simulation:scaleProfile --no-daemon --console=plain

      - name: Build documentation
        run: |
          npm ci
          npm run docs:build

      - name: Remove one-shot finalizer
        shell: bash
        run: |
          rm -f tools/finalize-architecture-reset.py
          rm -f .github/workflows/finalize-architecture-reset.yml
          rmdir tools 2>/dev/null || true

      - name: Commit verified finalization
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs(architecture): finalize reset and Stage 5 checkpoint'
          git push origin HEAD:${{ github.head_ref }}
