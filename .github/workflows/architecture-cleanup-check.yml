name: Architecture Cleanup Check

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  architecture:
    if: github.head_ref == 'agent/architecture-final-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - run: ./gradlew :simulation:test --no-daemon --console=plain
