name: Generated World Audit

on:
  workflow_dispatch:
    inputs:
      ticks:
        description: 'Final generated-world audit tick (minimum 4)'
        required: true
        default: '500'
        type: string
      side:
        description: 'Square audit world side length (8..128)'
        required: true
        default: '32'
        type: string
  pull_request:
    paths:
      - '.github/workflows/generated-world-audit.yml'
      - 'simulation/build.gradle'
      - 'simulation/src/main/java/io/github/evoforge/simulation/world/**'
      - 'simulation/src/test/java/io/github/evoforge/simulation/world/**'

permissions:
  contents: read

concurrency:
  group: generated-world-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Generated world audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Resolve audit workload
        id: workload
        env:
          REQUESTED_TICKS: ${{ inputs.ticks }}
          REQUESTED_SIDE: ${{ inputs.side }}
        run: |
          ticks="$REQUESTED_TICKS"
          side="$REQUESTED_SIDE"
          if [ -z "$ticks" ]; then
            ticks=100
          fi
          if [ -z "$side" ]; then
            side=32
          fi
          if ! [[ "$ticks" =~ ^[0-9]+$ ]] || [ "$ticks" -lt 4 ]; then
            echo "ticks must be an integer >= 4, got: $ticks" >&2
            exit 1
          fi
          if ! [[ "$side" =~ ^[0-9]+$ ]] || [ "$side" -lt 8 ] || [ "$side" -gt 128 ]; then
            echo "side must be an integer between 8 and 128, got: $side" >&2
            exit 1
          fi
          echo "ticks=$ticks" >> "$GITHUB_OUTPUT"
          echo "side=$side" >> "$GITHUB_OUTPUT"

      - name: Run generated world audit
        run: >-
          ./gradlew :simulation:generatedWorldAudit
          --no-daemon
          --console=plain
          -Devoforge.generated.audit.ticks=${{ steps.workload.outputs.ticks }}
          -Devoforge.generated.audit.side=${{ steps.workload.outputs.side }}
