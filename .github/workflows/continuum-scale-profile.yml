name: Continuum Scale Profile

on:
  pull_request:
    paths:
      - 'foundation/src/main/java/**'
      - 'foundation/build.gradle'
      - 'world/src/main/java/**'
      - 'world/src/test/java/**'
      - 'world/build.gradle'
      - 'simulation/src/main/java/io/github/evoforge/simulation/time/**'
      - 'simulation/src/test/java/io/github/evoforge/simulation/time/**'
      - 'simulation/src/test/java/io/github/evoforge/simulation/profile/ContinuumTime*'
      - 'simulation/build.gradle'
      - '.github/workflows/continuum-scale-profile.yml'
  push:
    branches:
      - develop
    paths:
      - 'foundation/src/main/java/**'
      - 'foundation/build.gradle'
      - 'world/src/main/java/**'
      - 'world/src/test/java/**'
      - 'world/build.gradle'
      - 'simulation/src/main/java/io/github/evoforge/simulation/time/**'
      - 'simulation/src/test/java/io/github/evoforge/simulation/time/**'
      - 'simulation/src/test/java/io/github/evoforge/simulation/profile/ContinuumTime*'
      - 'simulation/build.gradle'
      - '.github/workflows/continuum-scale-profile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: continuum-scale-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    name: Continuum scale profile
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run scale profiles
        run: ./gradlew :world:scaleProfile :simulation:scaleProfile --no-daemon --console=plain
