name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Gradle tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon --console=plain

  architecture-cleanup:
    name: Repair architecture tree
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/architecture-simplification'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: agent/architecture-simplification

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Apply deterministic cleanup
        run: python3 scripts/architecture_cleanup_phase1.py

      - name: Validate patch
        run: git diff --check

      - name: Run complete test suite
        run: ./gradlew clean test --no-daemon --console=plain

      - name: Run scale profiles
        run: ./gradlew :world:scaleProfile :physics:scaleProfile --no-daemon --console=plain

      - name: Commit validated tree when changed
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Architecture tree already simplified"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(architecture): collapse modules into world generator physics"
          git push origin HEAD:agent/architecture-simplification
