name: Sync Wiki

on:
  push:
    branches:
      - main
    paths:
      - "docs/wiki/**"
      - "docs/ru/wiki/**"
      - "scripts/prepare-wiki.mjs"
      - ".github/workflows/sync-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Publish multilingual docs to GitHub Wiki
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Prepare multilingual Wiki tree
        run: node scripts/prepare-wiki.mjs wiki-stage

      - name: Clone wiki repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki; then
            echo "::error::GitHub Wiki is not initialized. Create the first Wiki page once in the GitHub UI, then rerun this workflow."
            exit 1
          fi

      - name: Replace wiki contents from generated tree
        run: |
          find wiki -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a wiki-stage/. wiki/

      - name: Commit and push wiki
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi

          git commit -m "docs: sync multilingual wiki from ${GITHUB_SHA::7}"
          git push origin HEAD
