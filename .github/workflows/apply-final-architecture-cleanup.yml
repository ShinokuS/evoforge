name: Apply Final Architecture Cleanup

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

concurrency:
  group: apply-final-architecture-cleanup-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/architecture-final-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: chmod +x gradlew

      - name: Apply semantic cleanup
        run: python tools/run-final-architecture-cleanup.py

      - name: Validate patch
        run: git diff --check

      - name: Compile and run full tests with coverage gate
        run: ./gradlew test :simulation:jacocoTestCoverageVerification --no-daemon --console=plain

      - name: Run scale profiles
        run: ./gradlew :simulation:scaleProfile --no-daemon --console=plain

      - name: Build docs
        run: |
          npm ci
          npm run docs:build

      - name: Remove one-shot tooling
        run: |
          rm -f tools/apply-final-architecture-cleanup.py
          rm -f tools/run-final-architecture-cleanup.py
          rm -f .github/workflows/apply-final-architecture-cleanup.yml
          rm -f .github/workflows/architecture-cleanup-check.yml
          rmdir tools 2>/dev/null || true

      - name: Commit verified cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor(architecture): remove residual legacy boundaries'
          git push origin HEAD:${{ github.head_ref }}
