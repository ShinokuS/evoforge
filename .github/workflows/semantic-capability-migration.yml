name: Semantic Capability Migration

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'agent/simulation-architecture-reset'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout architecture branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate migration tooling
        run: |
          python -m py_compile tools/semantic-capability-migration.py
          python -m py_compile tools/semantic-capability-import-repair.py

      - name: Apply audited semantic-capability migration
        run: python tools/semantic-capability-migration.py

      - name: Repair imports exposed by package separation
        run: python tools/semantic-capability-import-repair.py

      - name: Reject malformed patch output
        run: git diff --check

      - name: Run full test suite
        run: ./gradlew test --no-daemon --console=plain

      - name: Run simulation scale profiles
        run: ./gradlew :simulation:scaleProfile --no-daemon --console=plain

      - name: Remove one-shot migration transport
        shell: bash
        run: |
          rm -rf tools/semantic-migration-parts
          rm -f tools/semantic-capability-migration.py
          rm -f tools/semantic-capability-import-repair.py
          rm -f .github/workflows/semantic-capability-migration.yml
          rmdir tools 2>/dev/null || true

      - name: Commit migration only after verification is green
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit -m 'refactor(architecture): apply semantic capability boundaries'
          git push origin HEAD:${{ github.head_ref }}
