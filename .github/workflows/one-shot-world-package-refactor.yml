name: One-shot world package refactor

on:
  push:
    branches:
      - agent/architecture-firewall-step2-world-package
    paths:
      - '.github/workflows/one-shot-world-package-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: agent/architecture-firewall-step2-world-package
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Rename world packages mechanically
        shell: bash
        run: |
          set -euo pipefail

          OLD_MAIN='world/src/main/java/io/github/evoforge/simulation/world/continuum'
          NEW_MAIN='world/src/main/java/io/github/evoforge/world/continuum'
          OLD_TEST='world/src/test/java/io/github/evoforge/simulation/world/continuum'
          NEW_TEST='world/src/test/java/io/github/evoforge/world/continuum'
          OLD_PROFILE='world/src/test/java/io/github/evoforge/simulation/profile'
          NEW_PROFILE='world/src/test/java/io/github/evoforge/world/profile'

          test -d "$OLD_MAIN"
          test -d "$OLD_TEST"

          mkdir -p "$(dirname "$NEW_MAIN")" "$(dirname "$NEW_TEST")" "$NEW_PROFILE"
          git mv "$OLD_MAIN" "$NEW_MAIN"
          git mv "$OLD_TEST" "$NEW_TEST"

          for file in \
            ContinuumLocalQueryScaleProfileTest.java \
            ContinuumMapResponsivenessProfileTest.java \
            ContinuumMapScaleProfileTest.java \
            ContinuumScaleProfileTest.java \
            ContinuumScaleResolutionProfileTest.java \
            ContinuumScaleWorkload.java; do
            git mv "$OLD_PROFILE/$file" "$NEW_PROFILE/$file"
          done

          while IFS= read -r -d '' file; do
            sed -i 's/io\.github\.evoforge\.simulation\.world\.continuum/io.github.evoforge.world.continuum/g' "$file"
          done < <(git grep -IlZ 'io.github.evoforge.simulation.world.continuum' -- '*.java' '*.md' '*.gradle' '*.yml' || true)

          sed -i 's/package io\.github\.evoforge\.simulation\.profile;/package io.github.evoforge.world.profile;/' "$NEW_PROFILE"/*.java

          sed -i \
            -e "s#world/src/main/java/io/github/evoforge/simulation/world/continuum/\*\*#world/src/main/java/io/github/evoforge/world/continuum/**#g" \
            -e "s#world/src/test/java/io/github/evoforge/simulation/world/continuum/\*\*#world/src/test/java/io/github/evoforge/world/continuum/**#g" \
            -e "s#world/src/test/java/io/github/evoforge/simulation/profile/Continuum\*#world/src/test/java/io/github/evoforge/world/profile/Continuum*#g" \
            .github/workflows/continuum-scale-profile.yml

          cat >> world/build.gradle <<'EOF'

          tasks.register('architectureGuard') {
              description = 'Rejects simulation/presentation dependencies from the authoritative world module.'
              group = 'verification'

              doLast {
                  def forbidden = [
                          'io.github.evoforge.simulation.',
                          'io.github.evoforge.visualizer.',
                          'com.badlogic.gdx.'
                  ]
                  def violations = []
                  fileTree('src/main/java') {
                      include '**/*.java'
                  }.each { source ->
                      source.eachLine { line, number ->
                          forbidden.each { prefix ->
                              if (line.contains(prefix)) {
                                  violations << "${source}:$number contains forbidden dependency '$prefix'"
                              }
                          }
                      }
                  }
                  if (!violations.isEmpty()) {
                      throw new GradleException('World architecture firewall violated:\n' + violations.join('\n'))
                  }
              }
          }

          check.dependsOn architectureGuard
          EOF

          if git grep -n 'io.github.evoforge.simulation.world.continuum' -- ':!docs/journal/**'; then
            echo 'Old Continuum Java namespace remains after mechanical rename.' >&2
            exit 1
          fi

      - name: Verify full project
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon --console=plain
          ./gradlew :world:scaleProfile :simulation:scaleProfile --no-daemon --console=plain

      - name: Commit refactor result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'refactor(world): align Continuum package ownership'
          git push origin HEAD:agent/architecture-firewall-step2-world-package
