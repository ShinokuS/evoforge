name: Reconcile Final Architecture Docs

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  reconcile:
    if: github.head_ref == 'agent/architecture-final-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Reconcile canonical docs
        run: python tools/reconcile-final-architecture-docs.py
      - name: Validate patch
        run: git diff --check
      - name: Build docs
        run: |
          npm ci
          npm run docs:build
      - name: Remove one-shot tooling
        run: |
          rm -f tools/reconcile-final-architecture-docs.py
          rm -f .github/workflows/reconcile-final-architecture-docs.yml
          rmdir tools 2>/dev/null || true
      - name: Commit verified docs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs(architecture): reconcile final semantic topology'
          git push origin HEAD:${{ github.head_ref }}
