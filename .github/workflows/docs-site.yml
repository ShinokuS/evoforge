name: Docs Site

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/check-docs-i18n.mjs"
      - "scripts/stamp-docs-i18n.mjs"
      - "scripts/stamp-docs-i18n.test.mjs"
      - "scripts/prepare-wiki.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs-site.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "scripts/check-docs-i18n.mjs"
      - "scripts/stamp-docs-i18n.mjs"
      - "scripts/stamp-docs-i18n.test.mjs"
      - "scripts/prepare-wiki.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install documentation dependencies
        run: npm ci

      - name: Test documentation i18n tooling
        run: npm run docs:i18n:test

      - name: Check documentation locales
        run: npm run docs:i18n:check

      - name: Validate multilingual Wiki staging
        run: node scripts/prepare-wiki.mjs /tmp/evoforge-wiki-preview

      - name: Build VitePress site
        run: npm run docs:build

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy documentation
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
