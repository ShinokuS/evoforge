name: Post-Migration Semantic Cleanup

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

concurrency:
  group: post-migration-semantic-cleanup-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.head_ref == 'agent/simulation-architecture-reset'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout architecture branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Apply post-migration semantic cleanup
        run: python tools/post-migration-cleanup.py

      - name: Reject malformed patch output
        run: git diff --check

      - name: Run full test suite
        run: ./gradlew test --no-daemon --console=plain

      - name: Run simulation scale profiles
        run: ./gradlew :simulation:scaleProfile --no-daemon --console=plain

      - name: Build documentation
        run: |
          npm ci
          npm run docs:build

      - name: Remove one-shot cleanup transport
        shell: bash
        run: |
          rm -f tools/post-migration-cleanup.py
          rm -f .github/workflows/post-migration-cleanup.yml
          rmdir tools 2>/dev/null || true

      - name: Commit verified cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No cleanup changes to commit.'
            exit 0
          fi
          git commit -m 'refactor(architecture): finish semantic capability cleanup'
          git push origin HEAD:${{ github.head_ref }}
