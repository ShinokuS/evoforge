apply plugin: 'jacoco'

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

eclipse.project.name = appName + '-simulation'

dependencies {
    implementation "com.google.code.gson:gson:$gsonVersion"
    implementation "org.slf4j:slf4j-api:$slf4jVersion"

    testImplementation "org.junit.jupiter:junit-jupiter:$junitVersion"
    testImplementation "com.tngtech.archunit:archunit:1.5.0"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testRuntimeOnly "org.slf4j:slf4j-nop:$slf4jVersion"
}

test {
    useJUnitPlatform {
        excludeTags 'scale-profile'
    }

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat = "full"
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.82
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.60
            }
        }
    }
}

tasks.register('scaleProfile', Test) {
    description = 'Runs all representative simulation and Continuum scale/performance profiles.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'scale-profile'
    }

    systemProperty 'evoforge.scale.profile',
            System.getProperty('evoforge.scale.profile', 'medium')

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat = "full"
        showStandardStreams = true
    }

    outputs.upToDateWhen { false }
}
