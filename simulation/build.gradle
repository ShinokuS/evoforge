[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

eclipse.project.name = appName + '-simulation'

dependencies {
    implementation "com.google.code.gson:gson:$gsonVersion"
    implementation "org.slf4j:slf4j-api:$slf4jVersion"

    testImplementation "org.junit.jupiter:junit-jupiter:$junitVersion"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testRuntimeOnly "org.slf4j:slf4j-nop:$slf4jVersion"
}

test {
    useJUnitPlatform {
        excludeTags 'scale-profile', 'worldgen-scale-profile', 'generated-world-audit'
    }

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat = "full"
    }
}

tasks.register('scaleProfile', Test) {
    description = 'Runs the representative living-world scale profile.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'scale-profile'
    }

    systemProperty 'evoforge.scale.profile',
            System.getProperty('evoforge.scale.profile', 'medium')

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat = "full"
        showStandardStreams = true
    }

    outputs.upToDateWhen { false }
}

tasks.register('worldgenScaleProfile', Test) {
    description = 'Runs deterministic end-to-end world-generation profiling at a configurable side length.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'worldgen-scale-profile'
    }

    systemProperty 'evoforge.worldgen.profile.side',
            System.getProperty('evoforge.worldgen.profile.side', '512')

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat = "full"
        showStandardStreams = true
    }

    outputs.upToDateWhen { false }
}

tasks.register('generatedWorldAudit', Test) {
    description = 'Runs deterministic generated-world warmup audits and prints checkpoint snapshots.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'generated-world-audit'
    }

    systemProperty 'evoforge.generated.audit.ticks',
            System.getProperty('evoforge.generated.audit.ticks', '100')
    systemProperty 'evoforge.generated.audit.side',
            System.getProperty('evoforge.generated.audit.side', '32')

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat = "full"
        showStandardStreams = true
    }

    outputs.upToDateWhen { false }
}
